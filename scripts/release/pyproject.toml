[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poof-release-tools"
version = "0.1.0"
description = "Validation and support tools for poof release assets"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
