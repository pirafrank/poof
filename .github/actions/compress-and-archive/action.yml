name: "Compress and Archive"
description: "Compresses files into an archive and generates SHA256 checksum"
inputs:
  filenamebase:
    description: "Base filename for the archive (without extension)"
    required: true
  files:
    description: "Space-separated list of files to copy to the archive"
    required: true
  binary_path:
    description: "Path to the binary file to include"
    required: true
outputs:
  archive_name:
    description: "Name of the created archive file"
    value: ${{ steps.archive.outputs.archive_name }}
  archive_path:
    description: "Path to the created archive file"
    value: ${{ steps.archive.outputs.archive_path }}
  sha256_name:
    description: "Name of the SHA256 checksum file"
    value: ${{ steps.archive.outputs.sha256_name }}
  sha256_path:
    description: "Path to the SHA256 checksum file"
    value: ${{ steps.archive.outputs.sha256_path }}
runs:
  using: "composite"
  steps:
    - name: Compress and archive
      id: archive
      shell: bash
      env:
        FILENAMEBASE: ${{ inputs.filenamebase }}
        FILES: ${{ inputs.files }}
        BINARY_PATH: ${{ inputs.binary_path }}
      run: |
        set -euo pipefail
        [[ "$FILENAMEBASE" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
        mkdir -p _temp/release
        # Whitespace-separated literal filenames; no shell evaluation or glob expansion.
        read -r -a files <<< "$FILES"
        for file in "${files[@]}"; do
          cp -- "$file" _temp/release/
        done
        cp -- "$BINARY_PATH" _temp/release/
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          ARCHIVE="$FILENAMEBASE.zip"
          (cd _temp/release && 7z a -tzip "../$ARCHIVE" ./*)
        else
          ARCHIVE="$FILENAMEBASE.tar.gz"
          tar -czf "_temp/$ARCHIVE" -C _temp/release .
        fi
        (cd _temp
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
        )
        echo "archive_name=$ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "archive_path=_temp/$ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "sha256_name=$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
        echo "sha256_path=_temp/$ARCHIVE.sha256" >> "$GITHUB_OUTPUT"
