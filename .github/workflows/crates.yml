name: Crates.io Publish

on:
  release:
    # only for newly published releases, not drafts or updates to existing ones
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
        default: "v0.0.0"

permissions: {}

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    # Only run if the Release workflow succeeded and was triggered by a tag
    if: >
      (github.event_name == 'workflow_dispatch' &&
        startsWith(github.event.inputs.tag, 'v')) ||
      (github.event_name == 'release' &&
        github.event.release.draft == false &&
        github.event.release.prerelease == false)

    environment: "publish-crates"
    permissions:
      contents: read
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - name: Get app info
        id: info
        uses: ./.github/actions/get-info
      - name: Match published tag to crate version
        uses: ./.github/actions/match-version-check
        with:
          app_version: ${{ steps.info.outputs.app_version }}
          compare_to: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Match crates.io requirements without installing all project toolchain components.
          toolchain: stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
