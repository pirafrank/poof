name: Release
run-name: ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions: {}

env:
  BIN_NAME: poof

jobs:
  checks:
    permissions:
      contents: read
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      APP_NAME: ${{ steps.info.outputs.app_name }}
      APP_VERSION: ${{ steps.info.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Get app info
        id: info
        uses: ./.github/actions/get-info

      - name: Match version check
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/match-version-check
        with:
          app_version: ${{ steps.info.outputs.app_version }}
          compare_to: ${{ github.ref }}

  generate_man:
    permissions:
      contents: read
    name: Generate man
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Setup just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Generate man pages
        run: just man

      - name: Upload man pages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ needs.checks.outputs.APP_NAME }}.1
          path: man/${{ needs.checks.outputs.APP_NAME }}.1
          if-no-files-found: error
          retention-days: 1
          compression-level: 0  # no compression

  make_matrix:
    permissions:
      contents: read
    name: Create matrix
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      MATRIX_FILE: matrix.jsonc
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - id: set-matrix
        name: Set matrix
        run: |
          echo "matrix=$(grep -v '//' "$MATRIX_FILE" | jq -c '.')" >> "$GITHUB_OUTPUT"

  build_release:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    name: Build release
    needs: [ checks, make_matrix ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{fromJson(needs.make_matrix.outputs.matrix)}}
      max-parallel: 5
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Setup just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install cross-compilation tools
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        if: ${{ matrix.builder == 'cargo' }}
        with:
          target: ${{ matrix.target }}

      - name: Install cross toolchain
        if: ${{ matrix.builder == 'cross' }}
        run: cargo install cross --version 0.2.5 --locked

      # Force the subsequent build to use exactly the image inspected here.
      - name: Resolve Cross build image
        if: ${{ matrix.builder == 'cross' }}
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/build_environment.py prepare-cross --target "$TARGET"

      - name: Build for release using ${{ matrix.builder }}
        env:
          BUILDER: ${{ matrix.builder }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$BUILDER" in cargo|cross) ;; *) exit 1 ;; esac
          "$BUILDER" build --target "$TARGET" --release --locked

      - name: Compress and archive
        id: archive
        uses: ./.github/actions/compress-and-archive
        with:
          filenamebase: ${{ needs.checks.outputs.APP_NAME }}-${{ needs.checks.outputs.APP_VERSION }}-${{ matrix.target }}
          files: LICENSE README.md CHANGELOG.md SECURITY.md
          binary_path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Record release build environment
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
          MATRIX_ENTRY: ${{ toJson(matrix) }}
          RUNNER_LABEL: ${{ matrix.os }}
          ARCHIVE: ${{ steps.archive.outputs.archive_path }}
          RECORD: _temp/${{ needs.checks.outputs.APP_NAME }}-${{ needs.checks.outputs.APP_VERSION }}-${{ matrix.target }}.build-environment.json
        run: |
          python3 scripts/release/build_environment.py collect \
            --target "$TARGET" --builder "$BUILDER" --runner "$RUNNER_LABEL" \
            --matrix "$MATRIX_ENTRY" --archive "$ARCHIVE" --output "$RECORD"

      - name: Prepare dependency inventory
        run: |
          mkdir -p _sbom
          cp Cargo.toml Cargo.lock _sbom/
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: _sbom
          syft-version: v1.55.0  # latest as of 2026-11-02.
          format: spdx-json
          output-file: _temp/${{ needs.checks.outputs.APP_NAME }}-${{ needs.checks.outputs.APP_VERSION }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest binary and archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/${{ matrix.target }}/release/${{ env.BIN_NAME }}
            ${{ steps.archive.outputs.archive_path }}
      - name: Associate signed SBOM with binary and archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            target/${{ matrix.target }}/release/${{ env.BIN_NAME }}
            ${{ steps.archive.outputs.archive_path }}
          sbom-path: _temp/${{ needs.checks.outputs.APP_NAME }}-${{ needs.checks.outputs.APP_VERSION }}-${{ matrix.target }}.spdx.json
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_DIGEST: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          ARCHIVE: ${{ steps.archive.outputs.archive_path }}
          TARGET: ${{ matrix.target }}
        run: |
          for subject in "target/$TARGET/release/$BIN_NAME" "$ARCHIVE"; do
            gh attestation verify "$subject" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/release.yml" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_DIGEST"
            gh attestation verify "$subject" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/release.yml" --source-ref "$SOURCE_REF" --source-digest "$SOURCE_DIGEST" --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Upload target release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.archive_path }}
            _temp/*.spdx.json
            _temp/*.build-environment.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0  # no compression

  finalize_release_assets:
    name: Finalize and sign release assets
    runs-on: ubuntu-24.04
    environment: release-signing
    needs: [ checks, make_matrix, build_release, generate_man ]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download build outputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '{release-*,poof.1}'
          path: incoming
      - name: Assemble assets and checksum manifest
        env:
          VERSION: ${{ needs.checks.outputs.APP_VERSION }}
          MATRIX: ${{ needs.make_matrix.outputs.matrix }}
        run: |
          python3 scripts/release/finalize_assets.py --source incoming \
            --destination artifacts --version "$VERSION" --matrix "$MATRIX"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify checksum manifest
        env:
          VERSION: ${{ needs.checks.outputs.APP_VERSION }}
          SIGNER_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        working-directory: artifacts
        run: |
          manifest="poof-$VERSION-checksums.txt"
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" "$manifest"
          cosign verify-blob --bundle "$manifest.sigstore.json" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$manifest"
          sha256sum --check "$manifest"
      - name: Upload finalized release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: finalized-release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0  # no compression

  make_release:
    permissions:
      contents: write
    name: Release
    runs-on: ubuntu-latest
    needs: [ finalize_release_assets ]
    # Only run this job if the push event is a tag push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download finalized release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: finalized-release-assets
          path: artifacts

      - name: Create release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Release notes for `${{ github.ref_name }}` are available here: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'pre') || contains(github.ref, 'beta') || contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'nightly') }}
          # Note: drafts and prereleases cannot be set as latest.
          make_latest: ${{ !contains(github.ref, 'pre') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') && !contains(github.ref, 'alpha') && !contains(github.ref, 'nightly') }}
          fail_on_unmatched_files: true
          # no need to specify GITHUB_TOKEN here, it is automatically provided by GitHub Actions
