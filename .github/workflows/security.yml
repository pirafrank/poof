name: Security audit

on:
  push:
    branches:
      - main
      - pre/**
    paths:
      - '.github/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

permissions: {}

jobs:
  security_audit:
    permissions:
      issues: write
      checks: write
      contents: read
      pull-requests: write
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - name: Security audit
        uses: pirafrank/audit-check-action@v1

