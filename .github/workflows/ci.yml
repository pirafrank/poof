name: CI
run-name: CI on ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - '.github/**'
      - 'justfile'
      - '**/*.rs'
      - '**/*.ron'
      - '**/*.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'scripts/release/**'
      - 'matrix.jsonc'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci_checks:
    name: CI checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
      # Fail fast!
      fail-fast: true
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Setup just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Setup Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Run release script tests
        if: runner.os == 'Linux'
        working-directory: scripts/release
        run: |
          ./setup_venv.sh
          . ./.venv/bin/activate
          echo "Running release script tests..."
          ./run_tests.sh
          echo "Running JSON Schema validation..."
          ./run_schema_validation.sh
          deactivate

      - name: Perform CI checks
        run: just ci

      - name: Generate man pages
        run: just man
