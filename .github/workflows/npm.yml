name: Release to npm
run-name: Release ${{ inputs.tag }} to npm

# Packages and stages the five poof npm packages from an already-published,
# signed GitHub release. Never rebuilds Rust and never touches release assets.
# Scripts come from one main snapshot; package contents come from the signed release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and stage (e.g. v0.6.3)
        required: true
        type: string

permissions: {}

# Never cancel a run that may be mid-publication.
concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify_release:
    permissions:
      contents: read
      attestations: read
    name: Verify release
    outputs:
      infrastructure_sha: ${{ steps.revisions.outputs.infrastructure_sha }}
      source_sha: ${{ steps.revisions.outputs.source_sha }}
    runs-on: ubuntu-24.04
    steps:
      - name: Clone packaging infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          path: infrastructure
          persist-credentials: false
          fetch-depth: 1

      - name: Clone release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: release-source
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Verify release and download native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 infrastructure/scripts/npm/verify_release.py \
            --tag "$TAG" --matrix release-source/matrix.jsonc \
            --downloads downloads --evidence evidence.json

      - name: Record and validate revisions
        id: revisions
        run: |
          infrastructure_sha=$(git -C infrastructure rev-parse HEAD)
          source_sha=$(git -C release-source rev-parse HEAD)
          test "$source_sha" = "$(jq -r .commit evidence.json)"
          echo "infrastructure_sha=$infrastructure_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          jq -n --arg infrastructure_sha "$infrastructure_sha" --arg source_sha "$source_sha" \
            --arg run_id "$GITHUB_RUN_ID" --arg tag "$TAG" \
            '{infrastructure_sha:$infrastructure_sha,source_sha:$source_sha,run_id:$run_id,tag:$tag}' > revisions.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-verification
          path: |
            downloads
            evidence.json
            revisions.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # no compression

  stage_packages:
    permissions:
      contents: read
    name: Stage packages
    needs: verify_release
    runs-on: ubuntu-24.04
    steps:
      - name: Clone packaging infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify_release.outputs.infrastructure_sha }}
          path: infrastructure
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Download verification evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-verification

      - name: Clone verified release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify_release.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Pin npm
        run: npm install --global npm@11.21.3

      - name: Stage and pack the five packages
        run: |
          python3 infrastructure/scripts/npm/stage_packages.py \
            --evidence evidence.json --downloads downloads \
            --npm-dir release-source/npm --license release-source/LICENSE.md \
            --out staging --report staging/report.json

      - name: Upload staged tarballs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-staging
          path: |
            staging/tarballs
            staging/report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # no compression

  reconcile_registry:
    permissions:
      contents: read
    name: Reconcile registry
    needs: [verify_release, stage_packages]
    runs-on: ubuntu-24.04
    outputs:
      decisions: ${{ steps.reconcile.outputs.decisions }}
      dist_tag: ${{ steps.reconcile.outputs.dist_tag }}
    steps:
      - name: Clone packaging infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify_release.outputs.infrastructure_sha }}
          path: infrastructure
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Download staged tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-staging
          path: staging

      - name: Reconcile registry against staged bytes
        id: reconcile
        run: |
          python3 infrastructure/scripts/npm/verify_registry.py \
            --staging staging/report.json --out reconciliation.json
          echo "decisions=$(jq -c '.decisions' reconciliation.json)" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$(jq -r '.dist_tag' reconciliation.json)" >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-reconciliation
          path: reconciliation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # no compression

  publish_platform:
    environment: publish-npm
    permissions:
      contents: read
      id-token: write  # npm provenance via OIDC
    name: Publish ${{ matrix.npm.name }}
    needs: [ stage_packages, reconcile_registry ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Static copy of the four npm-publishable targets; scripts/npm tests
      # assert it still matches the targets derived from matrix.jsonc.
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            builder: cargo
            npm: { name: '@pirafrank/poof-linux-x64', os: linux, cpu: x64 }
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            builder: cargo
            npm: { name: '@pirafrank/poof-linux-arm64', os: linux, cpu: arm64 }
          - os: macos-15
            target: x86_64-apple-darwin
            builder: cargo
            npm: { name: '@pirafrank/poof-darwin-x64', os: darwin, cpu: x64 }
          - os: macos-15
            target: aarch64-apple-darwin
            builder: cargo
            npm: { name: '@pirafrank/poof-darwin-arm64', os: darwin, cpu: arm64 }
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Use Node.js version >=24.22.0 to ensure compatibility with npm trusted publishing
          node-version: '>=24.22.0'

      - name: Download staged tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-staging
          path: staging

      - name: Pin npm
        run: npm install --global npm@11.21.3

      - name: Submit package for approval
        env:
          PACKAGE: ${{ matrix.npm.name }}
          DECISIONS: ${{ needs.reconcile_registry.outputs.decisions }}
          DIST_TAG: ${{ needs.reconcile_registry.outputs.dist_tag }}
        run: |
          action=$(printf '%s' "$DECISIONS" | jq -er --arg name "$PACKAGE" '.[$name].action')
          case "$action" in
            skip) echo "$PACKAGE is already published with matching bytes"; exit 0 ;;
            publish) ;;
            *) echo "Unexpected registry decision: $action" >&2; exit 1 ;;
          esac
          filename=$(jq -er --arg name "$PACKAGE" \
            '(.platforms + [.base])[] | select(.package_name == $name) | .tarball.filename' staging/report.json)
          [[ "$filename" != */* && "$filename" != .* ]]
          test -f "staging/tarballs/$filename"
          npm stage publish "staging/tarballs/$filename" \
            --provenance --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org


  publish_launcher:
    environment: publish-npm
    permissions:
      contents: read
      id-token: write  # npm provenance via OIDC
    name: Publish @pirafrank/poof
    needs: [ reconcile_registry, publish_platform ]
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Use Node.js version >=24.22.0 to ensure compatibility with npm trusted publishing
          node-version: '>=24.22.0'

      - name: Download staged tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-staging
          path: staging

      - name: Pin npm
        run: npm install --global npm@11.21.3

      - name: Submit package for approval
        env:
          PACKAGE: '@pirafrank/poof'
          DECISIONS: ${{ needs.reconcile_registry.outputs.decisions }}
          DIST_TAG: ${{ needs.reconcile_registry.outputs.dist_tag }}
        run: |
          action=$(printf '%s' "$DECISIONS" | jq -er --arg name "$PACKAGE" '.[$name].action')
          case "$action" in
            skip) echo "$PACKAGE is already published with matching bytes"; exit 0 ;;
            publish) ;;
            *) echo "Unexpected registry decision: $action" >&2; exit 1 ;;
          esac
          filename=$(jq -er --arg name "$PACKAGE" \
            '(.platforms + [.base])[] | select(.package_name == $name) | .tarball.filename' staging/report.json)
          [[ "$filename" != */* && "$filename" != .* ]]
          test -f "staging/tarballs/$filename"
          npm stage publish "staging/tarballs/$filename" \
            --provenance --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org


      - name: Approval instructions
        run: |
          echo "Staging run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo 'Approve all four platform packages before the launcher on npmjs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Then run npm_verify.yml with this staging run ID.' >> "$GITHUB_STEP_SUMMARY"
